apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: postgres
    - name: redis
  interval: 10m
  sourceRef: { kind: GitRepository, name: infrastructure }
  path: "./k8s/apps"
  prune: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
