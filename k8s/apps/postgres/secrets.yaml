# Role passwords consumed by CNPG managed.roles. Each password must match the
# one the app uses in its own namespace secret.
# once sops needs to be secrets.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dex-db-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: dex
  password: "<DEX_POSTGRES_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: outline-db-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: outline
  password: "<OUTLINE_POSTGRES_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-db-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: vaultwarden
  password: "<VAULTWARDEN_POSTGRES_PASSWORD>"
