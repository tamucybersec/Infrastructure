apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg
  interval: 10m
  sourceRef: { kind: GitRepository, name: infrastructure }
  path: "./k8s/apps/postgres"
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres-cluster
      namespace: postgres
  decryption:
    provider: sops
    secretRef:
      name: sops-age
