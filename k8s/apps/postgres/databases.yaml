# cyberham is intentionally absent: it uses SQLite in its own PVC.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dex
  namespace: postgres
spec:
  ensure: present
  name: dex
  owner: dex
  cluster:
    name: postgres-cluster
