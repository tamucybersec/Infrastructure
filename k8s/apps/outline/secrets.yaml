apiVersion: v1
kind: Secret
metadata:
  name: outline-config
  namespace: outline
type: Opaque
stringData:
  URL: https://wiki.cybr.club
  PORT: "9454"
  DATABASE_URL: postgresql://<OUTLINE_POSTGRES_USER>:<OUTLINE_POSTGRES_PASSWORD>@postgres-cluster-rw.postgres.svc.cluster.local:5432/<OUTLINE_POSTGRES_DB>
  PGSSLMODE: disable
  REDIS_URL: redis://:<REDIS_PASSWORD>@redis.redis.svc.cluster.local:6379
  SECRET_KEY: <SECRET_KEY>
  UTILS_SECRET: <UTILS_SECRET>
  FILE_STORAGE: local
  FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
  FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"
  OIDC_CLIENT_ID: outline
  OIDC_CLIENT_SECRET: <OIDC_CLIENT_SECRET>
  OIDC_AUTH_URI: https://auth.cybr.club/dex/auth
  OIDC_TOKEN_URI: http://dex-release.dex.svc.cluster.local:5556/dex/token
  OIDC_USERINFO_URI: http://dex-release.dex.svc.cluster.local:5556/dex/userinfo
  OIDC_SCOPES: openid profile email groups offline_access
