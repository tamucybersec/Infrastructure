# Keys become filenames under /app/secrets. Mirror secrets.enc/ in the
# CyberHam repo. once sops needs to be secrets.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cyberham-secrets
  namespace: cyberham
type: Opaque
stringData:
  config.toml: |
    environment = "prod"
  config.prod.toml: |
    website_url = "https://cybr.club"
    data_dir = "data"

    [google]
    client_file_name = "<GOOGLE_CLIENT_FILE_NAME>"

    [discord]
    token = "<DISCORD_TOKEN>"
    test_guild_ids = [<GUILD_ID>]
    admin_channel_id = <ADMIN_CHANNEL_ID>
    aggie_role_id = <AGGIE_ROLE_ID>

    [ipcx]
    secret_key = "<IPC_SECRET_KEY>"
    port = 4729

    [dashboard]
    host = "0.0.0.0"
    port = 5183
  # filename must match google.client_file_name above
  "<GOOGLE_CLIENT_FILE_NAME>": |
    <GOOGLE_OAUTH_CLIENT_JSON>
  # seed copy; the live token is written to /app/data/token.json
  token.json: |
    <GOOGLE_OAUTH_TOKEN_JSON>
