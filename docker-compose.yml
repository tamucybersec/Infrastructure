name: infrastructure

networks:
  infra:
    name: infra

volumes:
  runner_data:
  registry_data:
  vaultwarden_data:
  db_data:
  dex_data:
  terraform_state:
  decrypted_secrets:
    name: decrypted_secrets

services:
  runner:
    build:
      context: runner
    image: runner:local
    container_name: github-runner
    restart: unless-stopped
    env_file:
      - secrets/runner/.env
    environment:
      - INFRA_DIR=${INFRA_DIR:?run compose.sh, not compose directly}
      - SOPS_DIR=${SOPS_DIR:?run compose.sh, not compose directly}
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/runner:/tmp/runner
      - runner_data:/runner/data
      - ./secrets/runner/config.json:/runner/data/.docker/config.json:ro
      - decrypted_secrets:/decrypted_secrets
      - ${INFRA_DIR}:${INFRA_DIR}
    networks:
      - infra
    depends_on:
      registry:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    env_file:
      - secrets/registry/.env
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      - registry_data:/var/lib/registry
      - ./secrets/registry/.htpasswd:/auth/htpasswd:ro
    networks:
      - infra
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/confs:/etc/nginx/sites-enabled:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./secrets/nginx:/etc/ssl/cybr.club:ro
    networks:
      - infra

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - secrets/postgres/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped
    env_file:
      - secrets/redis/.env
    networks:
      - infra
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  terraform:
    build:
      context: terraform
    image: terraform:${TF_IMAGE_TAG:-local}
    container_name: terraform
    restart: "no"
    env_file:
      - secrets/postgres/.env
      - secrets/cyberham/db.env
      - secrets/dex/db.env
      - secrets/outline/db.env
      - secrets/vaultwarden/db.env
    volumes:
      - terraform_state:/state
    networks:
      - infra
    depends_on:
      postgres:
        condition: service_healthy

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - secrets/vaultwarden/db.env
    volumes:
      - vaultwarden_data:/data
    networks:
      - infra
    depends_on:
      terraform:
        condition: service_completed_successfully

  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    env_file:
      - secrets/redis/.env
      - secrets/outline/db.env
      - secrets/outline/.env
    networks:
      - infra
    depends_on:
      terraform:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dex:
    image: dexidp/dex:latest
    container_name: dex
    restart: unless-stopped
    env_file:
      - secrets/dex/db.env
      - secrets/dex/.env
    volumes:
      - dex_data:/data
      - ./dex/config.yml:/etc/dex/config.yml:ro
    networks:
      - infra
    command: ["dex", "serve", "/etc/dex/config.yml"]