issuer: https://auth.cybr.club/dex

storage:
  type: postgres
  config:
    host: postgres
    port: 5432
    user: $POSTGRES_USER
    password: $POSTGRES_PASSWORD
    database: $POSTGRES_DB
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://auth.cybr.club/dex/callback
    orgs:
      - name: tamucybersec
        loadAllGroups: false
        teamNameField: slug
        useLoginAsID: false

staticClients:
  - id: outline
    name: Outline
    secretEnv: OUTLINE_CLIENT_SECRET
    redirectURIs:
      - https://wiki.cybr.club/auth/oidc.callback
