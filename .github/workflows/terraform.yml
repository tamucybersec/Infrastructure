name: Terraform Plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: self-hosted
    env:
      TF_IMAGE_TAG: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt secrets
        run: decrypt

      - name: Build image
        run: scripts/compose.sh build terraform

      - name: Format check
        run: >
          scripts/compose.sh run --rm -T --no-deps --entrypoint terraform
          terraform fmt -check -recursive -diff /work/stacks

      - name: Plan
        id: plan
        shell: bash
        run: >
          scripts/compose.sh run --rm -T --no-deps -e TF_MODE=plan terraform
          2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Comment plan
        if: always() && steps.plan.conclusion != 'skipped'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: await require('./.github/scripts/comment-plan.js')({ github, context })
